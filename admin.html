<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Restrito</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .painel-box {
            background: #181818;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            background: #252525;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #00b386;
        }
        .item-admin {
            background: #222;
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-excluir {
            background: #ff4d4d;
            color: white;
            padding: 5px 10px;
        }
        .btn-excluir:hover {
            background: #cc0000;
        }
    </style>
</head>
<body>

    <h1>Painel de Administração 🔒</h1>
    <p>Este link é restrito. As alterações feitas aqui aparecem instantaneamente na página principal da live.</p>

    <!-- Gerir Ofertas -->
    <div class="painel-box">
        <h2>Gerir Ofertas (Topo)</h2>
        <label>Texto da Oferta:</label>
        <input type="text" id="input-oferta-texto" placeholder="Ex: Frete grátis no produto X">
        
        <label>Link da Oferta:</label>
        <input type="text" id="input-oferta-link" placeholder="Ex: https://mercadolivre.com/...">
        
        <button onclick="adicionarOferta()">Adicionar Oferta</button>
        
        <h3>Ofertas Atuais:</h3>
        <div id="lista-admin-ofertas"></div>
    </div>

    <!-- Gerir Jogos/Itens -->
    <div class="painel-box">
        <h2>Gerir Jogos / Itens da Lista</h2>
        <label>Título:</label>
        <input type="text" id="input-item-titulo" placeholder="Nome do jogo ou item">
        
        <label>Link da Imagem:</label>
        <input type="text" id="input-item-imagem" placeholder="URL da imagem">
        
        <label>Descrição:</label>
        <textarea id="input-item-desc" placeholder="Breve descrição"></textarea>
        
        <button onclick="adicionarItem()">Adicionar Item</button>
        
        <h3>Itens Atuais:</h3>
        <div id="lista-admin-itens"></div>
    </div>

    <script>
        // --- OFERTAS ---
        function carregarAdminOfertas() {
            const ofertas = JSON.parse(localStorage.getItem('admin_ofertas')) || [];
            const container = document.getElementById('lista-admin-ofertas');
            container.innerHTML = '';

            ofertas.forEach((of, index) => {
                container.innerHTML += `
                    <div class="item-admin">
                        <span><b>${of.texto}</b> (${of.link || 'Sem link'})</span>
                        <button class="btn-excluir" onclick="removerOferta(${index})">Excluir</button>
                    </div>
                `;
            });
        }

        function adicionarOferta() {
            const texto = document.getElementById('input-oferta-texto').value;
            const link = document.getElementById('input-oferta-link').value;

            if (!texto) {
                alert('Escreva pelo menos o texto da oferta!');
                return;
            }

            const ofertas = JSON.parse(localStorage.getItem('admin_ofertas')) || [];
            ofertas.push({ texto, link });
            localStorage.setItem('admin_ofertas', JSON.stringify(ofertas));

            document.getElementById('input-oferta-texto').value = '';
            document.getElementById('input-oferta-link').value = '';
            carregarAdminOfertas();
        }

        function removerOferta(index) {
            const ofertas = JSON.parse(localStorage.getItem('admin_ofertas')) || [];
            ofertas.splice(index, 1);
            localStorage.setItem('admin_ofertas', JSON.stringify(ofertas));
            carregarAdminOfertas();
        }

        // --- ITENS/JOGOS ---
        function carregarAdminItens() {
            const itens = JSON.parse(localStorage.getItem('admin_itens')) || [];
            const container = document.getElementById('lista-admin-itens');
            container.innerHTML = '';

            itens.forEach((item, index) => {
                container.innerHTML += `
                    <div class="item-admin">
                        <span><b>${item.titulo}</b></span>
                        <button class="btn-excluir" onclick="removerItem(${index})">Excluir</button>
                    </div>
                `;
            });
        }

        function adicionarItem() {
            const titulo = document.getElementById('input-item-titulo').value;
            const imagem = document.getElementById('input-item-imagem').value;
            const descricao = document.getElementById('input-item-desc').value;

            if (!titulo) {
                alert('O título é obrigatório!');
                return;
            }

            const itens = JSON.parse(localStorage.getItem('admin_itens')) || [];
            itens.push({ titulo, imagem, descricao });
            localStorage.setItem('admin_itens', JSON.stringify(itens));

            document.getElementById('input-item-titulo').value = '';
            document.getElementById('input-item-imagem').value = '';
            document.getElementById('input-item-desc').value = '';
            carregarAdminItens();
        }

        function removerItem(index) {
            const itens = JSON.parse(localStorage.getItem('admin_itens')) || [];
            itens.splice(index, 1);
            localStorage.setItem('admin_itens', JSON.stringify(itens));
            carregarAdminItens();
        }

        // Inicializar painel admin
        carregarAdminOfertas();
        carregarAdminItens();
    </script>
</body>
</html>
