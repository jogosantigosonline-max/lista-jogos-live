<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Jogos & Ofertas da Live — Retro Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090d16;
    --card: #131b2e;
    --card-hover: #1a2642;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --border: #1e293b;
    --success: #10b981;
    --meli: #ffe600;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container {
    width: 100%; max-width: 520px;
    padding: 30px 20px 60px;
    margin: 0 auto;
  }
  .header {
    text-align: center; margin-bottom: 20px;
  }
  .logo-badge {
    width: 68px; height: 68px; border-radius: 20px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 14px;
    box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
  }
  h1 {
    font-size: 24px; font-weight: 800; margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--muted); font-size: 14px; line-height: 1.5;
    margin: 0 auto; max-width: 38ch;
  }

  /* Mercado Livre Rotator Banner */
  .meli-banner {
    background: linear-gradient(135deg, #1e293b, #131b2e);
    border: 2px solid var(--meli);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 24px;
    position: relative;
    box-shadow: 0 8px 20px rgba(255, 230, 0, 0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: opacity 0.5s ease;
  }
  .meli-header-tag {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: var(--meli);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .meli-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
    line-height: 1.4;
  }
  .meli-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .meli-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: #4ade80;
  }
  .meli-btn {
    background: var(--meli);
    color: #111827;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .meli-btn:hover {
    opacity: 0.9;
    transform: scale(1.02);
  }
  
  /* Search Box */
  .search-box {
    position: relative; margin-bottom: 20px;
  }
  .search-input {
    width: 100%; padding: 14px 16px 14px 44px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; color: var(--text); font-size: 14px;
    font-family: 'Outfit', sans-serif; outline: none;
    transition: all 0.2s ease;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: var(--muted);
  }

  /* Tabs Consoles Grid */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 8px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease;
    text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active {
    background: var(--accent); color: #090d16;
    border-color: var(--accent); font-weight: 700;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
  }

  /* Game List */
  .game-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .game-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; transition: all 0.2s ease;
  }
  .game-card:hover {
    background: var(--card-hover);
    border-color: rgba(245, 158, 11, 0.4);
    transform: translateY(-1px);
  }
  .game-info {
    flex: 1; min-width: 0;
  }
  .game-name {
    font-weight: 600; font-size: 15px; color: var(--text);
    margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-command {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--accent); background: rgba(245, 158, 11, 0.1);
    padding: 3px 8px; border-radius: 6px; display: inline-block;
  }
  .copy-btn {
    background: var(--border); border: none; color: var(--text);
    padding: 8px 14px; border-radius: 10px; font-size: 12.5px;
    font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .copy-btn:hover {
    background: var(--accent); color: #090d16;
  }
  .copy-btn.copied {
    background: var(--success); color: #fff;
  }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
    font-size: 14px; background: var(--card); border-radius: 14px;
    border: 1px solid var(--border);
  }

  footer {
    text-align: center; margin-top: 40px; color: var(--muted);
    font-size: 12px; line-height: 1.6;
  }
  footer strong { color: var(--text); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-badge">🎮</div>
    <h1>Lista de Jogos da Live</h1>
    <p class="subtitle">Pesquise o seu jogo favorito, copie o comando e confira as ofertas em destaque!</p>
  </div>

  <!-- Banner Rotativo do Mercado Livre (A cada 7 segundos) -->
  <div class="meli-banner" id="meliBanner">
    <div class="meli-header-tag">
      <span>⚡ Oferta em Destaque (Mercado Livre)</span>
      <span id="meliCounter">1/2</span>
    </div>
    <p class="meli-title" id="meliTitle">Carregando oferta...</p>
    <div class="meli-footer">
      <span class="meli-price" id="meliPrice">R$ 0,00</span>
      <a href="#" id="meliLink" target="_blank" class="meli-btn">Ver Oferta 🛒</a>
    </div>
  </div>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar jogo..." oninput="filterGames()">
  </div>

  <div class="tabs" id="tabsContainer"></div>
  
  <div id="gameListContainer" class="game-list"></div>

  <footer>
    Desenvolvido para lives de Retrogaming 🚀<br>
    Divirta-se e aproveite os clássicos!
  </footer>
</div>

<script>
// Produtos do Mercado Livre com rotação automática a cada 7 segundos
const meliOffers = [
  {
    title: "Controle Para Xbox 360 Com Fio Joystick Gamepass Steam Tv Pc Android - Crowley",
    price: "R$ 46,07",
    link: "https://meli.la/2inqeW2"
  },
  {
    title: "Adaptador Videogame Game Stick M15 2 Controles Game Stick",
    price: "R$ 219,90",
    link: "https://meli.la/2kxZ49N"
  }
];

let currentOfferIdx = 0;

function updateMeliBanner() {
  const offer = meliOffers[currentOfferIdx];
  const banner = document.getElementById('meliBanner');
  
  banner.style.opacity = '0.4';
  
  setTimeout(() => {
    document.getElementById('meliTitle').innerText = offer.title;
    document.getElementById('meliPrice').innerText = offer.price;
    document.getElementById('meliLink').href = offer.link;
    document.getElementById('meliCounter').innerText = `${currentOfferIdx + 1}/${meliOffers.length}`;
    banner.style.opacity = '1';
  }, 250);

  currentOfferIdx = (currentOfferIdx + 1) % meliOffers.length;
}

setInterval(updateMeliBanner, 7000);
updateMeliBanner();

// Base de dados exata extraída do ficheiro Excel oficial
const database = [
  {
    category: "Atari",
    items: [
      { name: "enduro", command: "!jogo atari enduro" },
      { name: "Abadox", command: "!jogo atari pac man" },
      { name: "rive raid", command: "!jogo atari river raid" },
      { name: "pitfall", command: "!jogo atari pitfall" }
    ]
  },
  {
    category: "Nintendinho",
    items: [
      { name: "1943", command: "!jogo nes 1943" },
      { name: "Abadox", command: "!jogo nes abadox" },
      { name: "Addams Family", command: "!jogo nes addams" },
      { name: "Arkanoid", command: "!jogo nes arkanoid" },
      { name: "Astyanax", command: "!jogo nes astyanax" },
      { name: "Balloon Fight", command: "!jogo nes balloon" },
      { name: "Batman (Return of the Joker)", command: "!jogo nes batman" },
      { name: "Battle City", command: "!jogo nes battle city" },
      { name: "Battleship", command: "!jogo nes battleship" },
      { name: "Battletoads", command: "!jogo nes battletoads" },
      { name: "Bionic Commando", command: "!jogo nes bionic" },
      { name: "Bomberman", command: "!jogo nes bomberman" }
    ]
  },
  {
    category: "Super Nintendo",
    items: [
      { name: "ActRaiser", command: "!jogo snes actraiser" },
      { name: "Addams Family", command: "!jogo snes addams family" },
      { name: "Adventures of Dr. Franken", command: "!jogo snes dr franken" },
      { name: "Aero Fighters", command: "!jogo snes aero fighters" },
      { name: "Aerobiz", command: "!jogo snes aerobiz" },
      { name: "Aladdin", command: "!jogo snes aladdin" },
      { name: "Alcahest", command: "!jogo snes alcahest" },
      { name: "Alien 3", command: "!jogo snes alien 3" },
      { name: "Animaniacs", command: "!jogo snes animaniacs" },
      { name: "Arcana", command: "!jogo snes arcana" }
    ]
  },
  {
    category: "Mega Drive",
    items: [
      { name: "A Lenda de Thor", command: "!jogo mega lenda de thor" },
      { name: "Addams Family", command: "!jogo mega addams family" },
      { name: "Aero the Acro-Bat", command: "!jogo mega aero acro bat" },

      { name: "Air Buster", command: "!jogo mega air buster" },

      { name: "Alex Kidd in the Enchanted Castle", command: "!jogo mega alex kidd" },
      { name: "Alien Storm", command: "!jogo mega alien storm" },
      { name: "Altered Beast", command: "!jogo mega altered beast" },
      { name: "Atomic Robo-Kid", command: "!jogo mega atomic robo kid" },
      { name: "Ayrton Senna's Super Monaco GP II", command: "!jogo mega senna monaco" }
    ]
  },
  {
    category: "Master System",
    items: [
      { name: "Action Fighter", command: "!jogo master action fighter" },
      { name: "Aerial Assault", command: "!jogo master aerial assault" },

    ]
  },
  {
    category: "N64",
    items: [
      { name: "wave race", command: "!jogo n64 wave race" },
      { name: "mario kart 64", command: "!jogo n64 mario kart" },
      { name: "crushi´n usa", command: "!jogo n64 usa" },
      { name: "mario tenis", command: "!jogo n64 mario tennis" }
    ]
  },
  {
    category: "Neo Geo",
    items: [
      { name: "Double Dragon", command: "!jogo neogeo doubledr" },
      { name: "Metal Slug", command: "!jogo neogeo mslug" },
      { name: "Aero Fighters 2", command: "!jogo neogeo sonicwi2" },
      { name: "Super Sidekicks 3", command: "!jogo neogeo ssideki3" }
    ]
  }
];

let activeTab = 0;

function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = database.map((cat, idx) => `
    <button class="tab ${idx === activeTab ? 'active' : ''}" onclick="switchTab(${idx})">
      ${cat.category}
    </button>
  `).join('');
}

function switchTab(idx) {
  activeTab = idx;
  document.getElementById('searchInput').value = '';
  renderTabs();
  renderGames(database[activeTab].items);
}

function renderGames(items) {
  const listContainer = document.getElementById('gameListContainer');
  if (items.length === 0) {
    listContainer.innerHTML = `<div class="empty-state">Nenhum jogo encontrado 🕵️‍♂️</div>`;
    return;
  }
  
  listContainer.innerHTML = items.map((game) => `
    <div class="game-card">
      <div class="game-info">
        <div class="game-name">${game.name}</div>
        <div class="game-command">${game.command}</div>
      </div>
      <button class="copy-btn" onclick="copyCommand('${escapeHtml(game.command)}', this)">
        📋 Copiar
      </button>
    </div>
  `).join('');
}

function filterGames() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    renderGames(database[activeTab].items);
    return;
  }

  let allMatches = [];
  database.forEach(cat => {
    cat.items.forEach(game => {
      if (game.name.toLowerCase().includes(query) || game.command.toLowerCase().includes(query)) {
        allMatches.push(game);
      }
    });
  });

  renderGames(allMatches);
}

function copyCommand(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const originalText = btn.innerHTML;
    btn.innerHTML = '✅ Copiado!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.classList.remove('copied');
    }, 1500);
  });
}

function escapeHtml(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

renderTabs();
renderGames(database[0].items);
</script>

</body>
</html>
