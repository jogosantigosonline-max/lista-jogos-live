<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Live</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        /* Estilo do Banner de Ofertas no Topo */
        #banner-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        #banner-texto {
            font-size: 18px;
            font-weight: bold;
            color: #00ffcc;
            margin-bottom: 10px;
        }
        #banner-container a {
            color: #ffcc00;
            text-decoration: none;
        }
        #banner-container a:hover {
            text-decoration: underline;
        }
        /* Resto da página (Jogos/Itens) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .card {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        .card img {
            max-width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Banner de Ofertas -->
    <div id="banner-container">
        <div id="banner-texto">A carregar ofertas...</div>
        <div id="banner-link"></div>
    </div>

    <h1>Lista de Jogos / Itens</h1>
    <div class="grid-container" id="lista-publica">
        <!-- Os itens cadastrados aparecem aqui automaticamente -->
    </div>

    <script>
        // Carrega as ofertas do LocalStorage
        function carregarBannerPublico() {
            const ofertas = JSON.parse(localStorage.getItem('admin_ofertas')) || [
                { texto: "Confira as melhores ofertas no Mercado Livre!", link: "#" }
            ];
            
            let indexAtual = 0;
            const textoEl = document.getElementById('banner-texto');
            const linkEl = document.getElementById('banner-link');

            function mostrarOferta(i) {
                if (ofertas.length === 0) return;
                const oferta = ofertas[i];
                textoEl.textContent = oferta.texto;
                if (oferta.link) {
                    linkEl.innerHTML = `<a href="${oferta.link}" target="_blank">Aceder à Oferta ➔</a>`;
                } else {
                    linkEl.innerHTML = '';
                }
            }

            mostrarOferta(indexAtual);

            // Rotação automática a cada 5 segundos
            if (ofertas.length > 1) {
                setInterval(() => {
                    indexAtual = (indexAtual + 1) % ofertas.length;
                    mostrarOferta(indexAtual);
                }, 5000);
            }
        }

        // Carrega os itens/jogos do LocalStorage
        function carregarItensPublicos() {
            const itens = JSON.parse(localStorage.getItem('admin_itens')) || [];
            const container = document.getElementById('lista-publica');
            container.innerHTML = '';

            itens.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${item.imagem ? `<img src="${item.imagem}" alt="${item.titulo}">` : ''}
                    <h3>${item.titulo}</h3>
                    <p>${item.descricao || ''}</p>
                `;
                container.appendChild(card);
            });
        }

        // Executa ao carregar a página
        carregarBannerPublico();
        carregarItensPublicos();
    </script>
</body>
</html>
