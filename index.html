<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de Jogos — Retro Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090d16;
    --card: #131b2e;
    --card-hover: #1a2642;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --border: #1e293b;
    --success: #10b981;
    --meli: #ffe600;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  .container {
    width: 100%; max-width: 560px;
    padding: 30px 20px 60px;
    margin: 0 auto;
  }
  .header {
    text-align: center; margin-bottom: 20px;
  }
  .logo-badge {
    width: 68px; height: 68px; border-radius: 20px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 14px;
    box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
  }
  h1 {
    font-size: 24px; font-weight: 800; margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--muted); font-size: 14px; line-height: 1.5;
    margin: 0 auto; max-width: 38ch;
  }

  /* Mercado Livre Rotator Banner */
  .meli-banner {
    background: linear-gradient(135deg, #1e293b, #131b2e);
    border: 2px solid var(--meli);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    position: relative;
    box-shadow: 0 8px 20px rgba(255, 230, 0, 0.15);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: opacity 0.4s ease;
  }
  .meli-banner img.product-img {
    width: 100%; height: 140px; object-fit: cover; border-radius: 10px; background: #000;
  }
  .meli-header-tag {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    color: var(--meli);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .meli-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
    line-height: 1.4;
  }
  .meli-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 4px;
  }
  .meli-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: #4ade80;
  }
  .meli-btn {
    background: var(--meli);
    color: #111827;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .meli-btn:hover {
    opacity: 0.9;
    transform: scale(1.02);
  }
  
  /* Search Box */
  .search-box {
    position: relative; margin-bottom: 20px;
  }
  .search-input {
    width: 100%; padding: 14px 16px 14px 44px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; color: var(--text); font-size: 14px;
    font-family: 'Outfit', sans-serif; outline: none;
    transition: all 0.2s ease;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    font-size: 16px; color: var(--muted);
  }

  /* Tabs Consoles Grid */
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 8px; border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.2s ease;
    text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab.active {
    background: var(--accent); color: #090d16;
    border-color: var(--accent); font-weight: 700;
    box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
  }

  /* Game List */
  .game-list {
    display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px;
  }
  .game-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; transition: all 0.2s ease;
  }
  .game-card:hover {
    background: var(--card-hover);
    border-color: rgba(245, 158, 11, 0.4);
    transform: translateY(-1px);
  }
  .game-info {
    flex: 1; min-width: 0;
  }
  .game-name {
    font-weight: 600; font-size: 15px; color: var(--text);
    margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-command {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--accent); background: rgba(245, 158, 11, 0.1);
    padding: 3px 8px; border-radius: 6px; display: inline-block;
  }
  .copy-btn {
    background: var(--border); border: none; color: var(--text);
    padding: 8px 14px; border-radius: 10px; font-size: 12.5px;
    font-weight: 600; cursor: pointer; transition: all 0.15s ease;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .copy-btn:hover {
    background: var(--accent); color: #090d16;
  }
  .copy-btn.copied {
    background: var(--success); color: #fff;
  }

  .empty-state {
    text-align: center; padding: 40px 20px; color: var(--muted);
    font-size: 14px; background: var(--card); border-radius: 14px;
    border: 1px solid var(--border);
  }

  footer {
    text-align: center; margin-top: 40px; color: var(--muted);
    font-size: 12px; line-height: 1.6;
  }
  footer strong { color: var(--text); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-badge">🎮</div>
    <h1>Lista de Jogos da Live</h1>
    <p class="subtitle">Pesquise o seu jogo favorito, copie o comando e confira as ofertas em destaque!</p>
  </div>

  <!-- Banner Rotativo do Mercado Livre (A cada 6 segundos) -->
  <div class="meli-banner" id="meliBanner">
    <div class="meli-header-tag">
      <span>⚡ Oferta em Destaque (Mercado Livre)</span>
      <span id="meliCounter">1/N</span>
    </div>
    <img id="meliImg" class="product-img" src="" alt="Produto Mercado Livre" style="display:none;">
    <p class="meli-title" id="meliTitle">Carregando oferta...</p>
    <div class="meli-footer">
      <span class="meli-price" id="meliPrice">R$ 0,00</span>
      <a href="#" id="meliLink" target="_blank" class="meli-btn">Ver Oferta 🛒</a>
    </div>
  </div>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar jogo..." oninput="filterGames()">
  </div>

  <div class="tabs" id="tabsContainer"></div>
  
  <div id="gameListContainer" class="game-list"></div>

  <footer>
    Desenvolvido para lives de Retrogaming 🚀
  </footer>
</div>

<script>
// Lista de produtos do Mercado Livre (comerciais do topo)
const meliOffers = [
  {
    title: "Mini Video Game Portátil 400 Em 1 Retrô Infantil Preto",
    price: "R$ 43,90",
    link: "https://meli.la/2nsrVHX",
    img: ""
  },
  {
    title: "Consola de jogos S10 com alça de controle remoto",
    price: "R$ 85,40",
    link: "https://meli.la/1uCWrDR",
    img: ""
  },
  {
    title: "Controle Sony Dualsense Sem Fio White Ps5",
    price: "R$ 391,23",
    link: "https://meli.la/1GsYs9M",
    img: ""
  },
  {
    title: "Miniatura Super Nintendo Escala 1:5 Impressão 3d Snes Geek",
    price: "R$ 95,00",
    link: "https://meli.la/1DREuXp",
    img: ""
  },
  {
    title: "Miniatura Mega Drive 3 Escala 1:5 Retro Game Geek Sega",
    price: "R$ 95,00",
    link: "https://meli.la/2Bxi9NE",
    img: ""
  },
  {
    title: "Miniatura Ps4 Playstation 1:5 Colecionável Gamer Retrô Geek",
    price: "R$ 104,50",
    link: "https://meli.la/1P4Cvmy",
    img: ""
  },
  {
    title: "Miniatura Realista Do Maracanã Com A Torcida Do Flamengo",
    price: "R$ 370,50",
    link: "https://meli.la/1LJ3FDX",
    img: ""
  },
  {
    title: "Miniatura Estádio Laranjeira Fluminense Decoração Futebol",
    price: "R$ 139,32",
    link: "https://meli.la/2SgCcWo",
    img: ""
  },
  {
    title: "Controle Para Xbox 360 Com Fio Joystick Gamepass Steam Tv Pc Android",
    price: "R$ 46,07",
    link: "https://meli.la/2inqeW2",
    img: ""
  },
  {
    title: "Adaptador Videogame Game Stick M15 2 Controles",
    price: "R$ 219,90",
    link: "https://meli.la/2kxZ49N",
    img: ""
  }
];

let currentMeliIndex = 0;
function rotateMeliBanner() {
  if (meliOffers.length === 0) return;
  const banner = document.getElementById('meliBanner');
  banner.style.opacity = 0;

  setTimeout(() => {
    const offer = meliOffers[currentMeliIndex];
    document.getElementById('meliTitle').textContent = offer.title;
    document.getElementById('meliPrice').textContent = offer.price;
    document.getElementById('meliLink').href = offer.link;
    document.getElementById('meliCounter').textContent = `${currentMeliIndex + 1}/${meliOffers.length}`;

    const imgEl = document.getElementById('meliImg');
    if (offer.img && offer.img.trim() !== "") {
      imgEl.src = offer.img;
      imgEl.style.display = "block";
    } else {
      imgEl.style.display = "none";
    }

    banner.style.opacity = 1;
    currentMeliIndex = (currentMeliIndex + 1) % meliOffers.length;
  }, 400);
}

setInterval(rotateMeliBanner, 6000);
rotateMeliBanner();

// Base de dados de jogos
const database = [
  {
    category: "Atari",
    items: [
      { name: "Enduro", command: "!jogo atari enduro" },
      { name: "River Raid", command: "!jogo atari river raid" },
      { name: "Pitfall", command: "!jogo atari pitfall" }
    ]
  },
  {
    category: "Nintendinho",
    items: [
      { name: "1943", command: "!jogo nes 1943" },
      { name: "Abadox", command: "!jogo nes abadox" },
      { name: "Battletoads", command: "!jogo nes battletoads" },
      { name: "Castlevania", command: "!jogo nes castlevania" },
      { name: "Contra", command: "!jogo nes contra" },
      { name: "Super Mario Bros. 3", command: "!jogo nes super mario 3" }
    ]
  },
  {
    category: "Super Nintendo",
    items: [
      { name: "Aladdin", command: "!jogo snes aladdin" },
      { name: "Chrono Trigger", command: "!jogo snes chrono trigger" },
      { name: "Donkey Kong Country", command: "!jogo snes donkey kong" },
      { name: "Final Fight", command: "!jogo snes final fight" },
      { name: "International Super Star Soccer Deluxe", command: "!jogo snes soccer deluxe" },
      { name: "Mortal Kombat 3", command: "!jogo snes mortal kombat 3" },
      { name: "Super Mario World", command: "!jogo snes mario world" },
      { name: "Top Gear", command: "!jogo snes top gear" }
    ]
  },
  {
    category: "Mega Drive",
    items: [
      { name: "Aladdin", command: "!jogo mega aladdin" },
      { name: "Comix Zone", command: "!jogo mega comix zone" },
      { name: "Contra - Hard Corps", command: "!jogo mega contra hard corps" },
      { name: "Golden Axe", command: "!jogo mega golden axe" },
      { name: "Sonic the Hedgehog", command: "!jogo mega sonic" }
    ]
  }
];

let activeCategory = database[0].category;

function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = '';
  database.forEach(cat => {
    const btn = document.createElement('div');
    btn.className = `tab ${cat.category === activeCategory ? 'active' : ''}`;
    btn.textContent = cat.category;
    btn.onclick = () => {
      activeCategory = cat.category;
      document.getElementById('searchInput').value = '';
      renderTabs();
      renderGames();
    };
    container.appendChild(btn);
  });
}

function renderGames() {
  const container = document.getElementById('gameListContainer');
  const catData = database.find(c => c.category === activeCategory);
  
  if (!catData || catData.items.length === 0) {
    container.innerHTML = `<div class="empty-state">Nenhum jogo encontrado nesta categoria.</div>`;
    return;
  }

  container.innerHTML = catData.items.map(item => `
    <div class="game-card">
      <div class="game-info">
        <div class="game-name">${item.name}</div>
        <div class="game-command">${item.command}</div>
      </div>
      <button class="copy-btn" onclick="copyCommand(this, '${item.command}')">
        📋 Copiar
      </button>
    </div>
  `).join('');
}

function filterGames() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const container = document.getElementById('gameListContainer');

  if (query === "") {
    renderGames();
    return;
  }

  let results = [];
  database.forEach(cat => {
    cat.items.forEach(item => {
      if (item.name.toLowerCase().includes(query) || item.command.toLowerCase().includes(query)) {
        results.push(item);
      }
    });
  });

  if (results.length === 0) {
    container.innerHTML = `<div class="empty-state">Nenhum jogo encontrado para "${query}".</div>`;
    return;
  }

  container.innerHTML = results.map(item => `
    <div class="game-card">
      <div class="game-info">
        <div class="game-name">${item.name}</div>
        <div class="game-command">${item.command}</div>
      </div>
      <button class="copy-btn" onclick="copyCommand(this, '${item.command}')">
        📋 Copiar
      </button>
    </div>
  `).join('');
}

function copyCommand(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copiado!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 Copiar';
      btn.classList.remove('copied');
    }, 1500);
  });
}

// Inicializar
renderTabs();
renderGames();
</script>

</body>
</html>
